<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Grid Matrix — Commission Viewer</title>
<style>
:root{
  --navy:#2D4E31; --navy2:#3E6845; --accent:#C9962C; --accent2:#E0B75A;
  --bg:#F3F7F3; --card:#ffffff; --ink:#1F2D22; --muted:#5A6B5D;
  --line:#DCE6DC; --green:#0e9f6e; --red:#e02424; --blue:#2563eb;
  --shadow:0 4px 18px rgba(31,45,34,.10); --radius:14px;
}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Segoe UI',system-ui,-apple-system,sans-serif;background:var(--bg);color:var(--ink);min-height:100vh}

/* ---------- Header (logo only) ---------- */
header{background:linear-gradient(120deg,var(--navy) 0%,var(--navy2) 60%,#4E7A54 100%);color:#fff;padding:0 26px;position:sticky;top:0;z-index:50;box-shadow:0 2px 12px rgba(0,0,0,.25)}
.hd{display:flex;align-items:center;gap:14px;height:62px;max-width:1400px;margin:0 auto}
.logo{height:36px;padding:4px 9px;border-radius:10px;background:#fff;display:flex;align-items:center;justify-content:center;box-shadow:0 2px 8px rgba(0,0,0,.3)}
.logo img{height:100%;width:auto;display:block}
.hd h1{font-size:17px;font-weight:700;letter-spacing:.3px}
.hd small{display:block;font-size:10.5px;font-weight:400;color:#C7D6C9;letter-spacing:1.4px;text-transform:uppercase;margin-top:1px}
.hd .spacer{flex:1}
.live{display:inline-flex;align-items:center;gap:7px;font-size:11px;font-weight:600;color:#C7D6C9;background:rgba(255,255,255,.10);border:1px solid rgba(255,255,255,.20);padding:5px 12px;border-radius:20px;white-space:nowrap}
.live .dot{width:8px;height:8px;border-radius:50%;background:#98a3bd}
.live.ok .dot{background:#37d39b;box-shadow:0 0 0 0 rgba(55,211,155,.6);animation:pulse 2s infinite}
.live.err .dot{background:var(--red)}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(55,211,155,.55)}70%{box-shadow:0 0 0 7px rgba(55,211,155,0)}100%{box-shadow:0 0 0 0 rgba(55,211,155,0)}}

/* ---------- Shell: left filters + right results ---------- */
.shell{max-width:1400px;margin:0 auto;padding:22px 26px 60px;display:grid;grid-template-columns:290px 1fr;gap:20px;align-items:start}
@media(max-width:880px){.shell{grid-template-columns:1fr;padding:14px 12px 44px;gap:12px}}

/* ---------- Mobile filter toggle (hidden on desktop) ---------- */
.filter-bar{display:none}
@media(max-width:880px){
  .filter-bar{display:flex;align-items:center;gap:10px;position:sticky;top:62px;z-index:45;background:var(--bg);padding:8px 0 4px}
}
.filter-toggle{flex:1;display:flex;align-items:center;justify-content:center;gap:9px;padding:12px 14px;border:1px solid var(--line);border-radius:11px;background:var(--card);color:var(--navy);font-size:14px;font-weight:700;cursor:pointer;box-shadow:var(--shadow)}
.filter-toggle .fcount{background:var(--accent);color:#fff;border-radius:20px;font-size:11px;font-weight:800;padding:1px 9px}
.filter-toggle .fcount:empty{display:none}
.filter-toggle .chev{margin-left:2px;transition:transform .2s}
body.filters-open .filter-toggle .chev{transform:rotate(180deg)}

/* ---------- Filters panel ---------- */
.filters{position:sticky;top:82px;background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);padding:18px 16px;z-index:60}
@media(max-width:880px){
  .filters{position:static;display:none;margin-bottom:2px}
  body.filters-open .filters{display:block;animation:drop .2s ease}
}
@keyframes drop{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:none}}
.fp-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px}
.fp-head h2{font-size:12px;text-transform:uppercase;letter-spacing:1px;color:var(--navy);font-weight:800}
.clr-all{font-size:11px;color:var(--accent);cursor:pointer;font-weight:800;letter-spacing:.3px;background:none;border:none}
.clr-all:hover{text-decoration:underline}
.fp-sec{font-size:10px;text-transform:uppercase;letter-spacing:1.1px;color:var(--muted);font-weight:800;margin:16px 0 8px}

/* LOB list */
#lobNav{display:flex;flex-direction:column;gap:3px}
.sub-item{display:flex;align-items:center;justify-content:space-between;gap:8px;width:100%;padding:9px 11px;border:none;background:none;border-radius:8px;font-size:12.5px;font-weight:600;color:var(--muted);cursor:pointer;transition:.15s;text-align:left}
.sub-item:hover{background:#F0F5F0;color:var(--navy)}
.sub-item.active{background:#E7EFE7;color:var(--navy);font-weight:800}
.sub-item .cnt{font-size:10.5px;background:#EEF1F6;color:var(--muted);border-radius:10px;padding:1px 8px;font-weight:700}
.sub-item.active .cnt{background:var(--accent);color:#fff}

/* Multiselect dropdowns */
.msdd{position:relative;width:100%;margin-bottom:9px}
.msdd > button{width:100%;padding:11px 30px 11px 12px;border:1px solid var(--line);border-radius:9px;font-size:13px;background:#fff;cursor:pointer;text-align:left;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.msdd > button::after{content:'\25BE';position:absolute;right:11px;top:50%;transform:translateY(-50%);color:var(--muted);font-size:11px}
.msdd.open > button{border-color:var(--accent);box-shadow:0 0 0 3px rgba(201,150,44,.15)}
.msdd .pnl{display:none;position:absolute;top:110%;left:0;right:auto;z-index:80;min-width:100%;width:max-content;max-width:min(360px,86vw);background:#fff;border:1px solid var(--line);border-radius:10px;box-shadow:0 12px 32px rgba(31,45,34,.2);max-height:320px;overflow:auto;padding:7px}
.msdd.open .pnl{display:block}
.msdd .pnl label{display:flex;gap:9px;align-items:flex-start;padding:7px 9px;border-radius:7px;font-size:12.5px;cursor:pointer;line-height:1.35;white-space:nowrap}
.msdd .pnl label:hover{background:#F0F5F0}
.msdd .pnl input{accent-color:var(--navy);margin-top:1px;flex-shrink:0}
.msdd .clr{font-size:11px;color:var(--accent);cursor:pointer;padding:6px 9px;font-weight:800;letter-spacing:.3px}
.msdd .clr:hover{text-decoration:underline}
.msdd .grp{font-size:10px;font-weight:800;text-transform:uppercase;color:var(--accent);padding:9px 9px 3px;letter-spacing:.8px;border-top:1px solid var(--line);margin-top:4px}
.msdd .grp:first-of-type{border-top:none;margin-top:0}

/* ---------- Results ---------- */
.res-head{display:flex;align-items:center;gap:12px;margin-bottom:12px;flex-wrap:wrap}
.res-head h2{font-size:16px;color:var(--navy);font-weight:800}
.chip-count{font-size:12.5px;color:var(--muted);font-weight:600;background:#fff;border:1px solid var(--line);border-radius:20px;padding:5px 13px}
.grid-wrap{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden}
.tbl-scroll{overflow:auto;max-height:74vh}
#tbl{width:100%;border-collapse:collapse;font-size:13px;min-width:820px}
#tbl thead th{position:sticky;top:0;background:var(--navy);color:#fff;text-align:left;padding:13px 14px;font-size:11.5px;text-transform:uppercase;letter-spacing:.7px;font-weight:600;cursor:pointer;user-select:none;white-space:nowrap;z-index:5}
#tbl thead th:hover{background:var(--navy2)}
#tbl thead th .arrow{font-size:10px;color:var(--accent2);margin-left:4px}
#tbl tbody td{padding:12px 14px;border-bottom:1px solid var(--line);vertical-align:top;color:var(--ink)}
#tbl tbody tr{transition:background .12s;cursor:pointer}
#tbl tbody tr:hover{background:#F5F1E3}
#tbl tbody tr:nth-child(even){background:#F7FAF7}
#tbl tbody tr:nth-child(even):hover{background:#F5F1E3}
.badge{display:inline-block;padding:3px 10px;border-radius:20px;font-size:11px;font-weight:700;white-space:nowrap}
.b-new{background:#e1f0ff;color:#1e64c8}.b-renew{background:#e2f7ee;color:#0b7a52}
.b-port{background:#f3e8ff;color:#7c3aed}.b-roll{background:#fff2df;color:#b45309}
.b-other{background:#eef1f6;color:#5a6478}
.rate{font-weight:800;color:var(--navy);white-space:pre-line}
.ratebar{height:5px;border-radius:3px;background:#E7EFE7;margin-top:5px;width:90px;overflow:hidden}
.ratebar i{display:block;height:100%;border-radius:3px;background:linear-gradient(90deg,var(--accent),var(--accent2))}
.rate-hi{color:var(--green)} .rate-zero{color:var(--red)}
.notes{max-width:320px;color:var(--muted);font-size:12px;line-height:1.45}
.insurer{font-weight:700;color:var(--navy)}
.locinfo{display:inline-flex;align-items:center;justify-content:center;width:17px;height:17px;border-radius:50%;background:#E7EFE7;color:var(--navy);font-size:10px;font-weight:800;cursor:help;margin-left:5px;vertical-align:middle;position:relative}
.locinfo:hover{background:var(--accent);color:#fff}
.locinfo:hover::after{content:attr(data-tip);position:absolute;top:150%;right:0;background:var(--navy);color:#fff;padding:11px 14px;border-radius:10px;font-size:11.5px;font-weight:500;line-height:1.55;width:300px;white-space:normal;text-align:left;box-shadow:0 10px 28px rgba(18,28,20,.35);z-index:60;border-left:3px solid var(--accent)}
.empty{padding:60px;text-align:center;color:var(--muted)}
.state{padding:70px 24px;text-align:center;color:var(--muted)}
.state .ic{font-size:40px;margin-bottom:12px}
.spin{width:34px;height:34px;border:3px solid #E7EFE7;border-top-color:var(--accent);border-radius:50%;margin:0 auto 14px;animation:rot .8s linear infinite}
@keyframes rot{to{transform:rotate(360deg)}}
.hidden{display:none !important}

/* ---------- Responsive: table becomes cards on phones ---------- */
@media(max-width:640px){
  .tbl-scroll{max-height:none;overflow:visible}
  #tbl{min-width:0}
  #tbl thead{display:none}
  #tbl,#tbl tbody{display:block;width:100%}
  #tbl tbody tr{display:block;margin:0 10px 12px;border:1px solid var(--line);border-radius:12px;overflow:hidden;box-shadow:0 2px 8px rgba(31,45,34,.06);background:#fff}
  #tbl tbody tr:nth-child(even){background:#fff}
  #tbl tbody tr:first-child{margin-top:10px}
  #tbl tbody td{display:flex;justify-content:space-between;gap:14px;align-items:baseline;padding:9px 14px;border-bottom:1px solid #EEF3EE;text-align:right}
  #tbl tbody td.blank{display:none}
  #tbl tbody td:last-child{border-bottom:none}
  #tbl tbody td::before{content:attr(data-label);flex:0 0 42%;text-align:left;font-size:10.5px;text-transform:uppercase;letter-spacing:.5px;color:var(--muted);font-weight:800;padding-top:1px}
  /* insurer row as a card header */
  #tbl tbody td.insurer{background:linear-gradient(120deg,var(--navy),var(--navy2));color:#fff;font-size:15px;padding:12px 14px;text-align:left;justify-content:flex-start}
  #tbl tbody td.insurer::before{content:'';display:none}
  #tbl tbody td.notes{text-align:left}
  #tbl tbody td.notes::before{flex-basis:auto}
  .ratebar{margin-left:auto}
  .res-head h2{font-size:15px}
  .locinfo:hover::after{width:220px}
  /* modal: stack label above value */
  .frow{flex-direction:column;gap:3px;padding:9px 0}
  .frow .k{width:auto}
  .modal .mb{padding:16px 18px}
}
@media(max-width:560px){
  header{padding:0 14px}
  .hd{gap:9px}
  .hbtn .lbl-long{display:none}
}
@media(max-width:480px){
  .hd h1{font-size:15px}
  .hd small{display:none}
  .live{padding:4px 8px;font-size:10px}
  #liveText{display:none}
}

/* ---------- Modal ---------- */
.overlay{position:fixed;inset:0;background:rgba(18,28,20,.55);display:flex;align-items:center;justify-content:center;z-index:100;backdrop-filter:blur(3px)}
.modal{background:#fff;border-radius:16px;max-width:640px;width:92%;max-height:84vh;overflow:auto;box-shadow:0 20px 60px rgba(0,0,0,.35)}
.modal .mh{background:linear-gradient(120deg,var(--navy),var(--navy2));color:#fff;padding:20px 24px;border-radius:16px 16px 0 0;display:flex;justify-content:space-between;align-items:flex-start}
.modal .mh h3{font-size:17px} .modal .mh p{font-size:12px;color:#C7D6C9;margin-top:3px}
.modal .close{background:rgba(255,255,255,.15);border:none;color:#fff;width:30px;height:30px;border-radius:8px;cursor:pointer;font-size:15px}
.modal .mb{padding:22px 24px}
.frow{display:flex;border-bottom:1px solid var(--line);padding:10px 0;gap:16px}
.frow .k{width:190px;flex-shrink:0;font-size:11.5px;text-transform:uppercase;letter-spacing:.6px;color:var(--muted);font-weight:700;padding-top:2px}
.frow .v{font-size:14px;white-space:pre-line}
footer{text-align:center;color:#93A695;font-size:12px;margin-top:34px}

/* ---------- Suggest-a-rate button, form & request list ---------- */
.hbtn{background:rgba(255,255,255,.15);border:1px solid rgba(255,255,255,.32);color:#fff;font-size:12.5px;font-weight:600;padding:8px 14px;border-radius:9px;cursor:pointer;white-space:nowrap;transition:.15s}
.hbtn:hover{background:rgba(255,255,255,.28)}
@media(max-width:480px){.hbtn{font-size:11.5px;padding:7px 10px}}
.rq-form{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.rq-form .full{grid-column:1/-1}
.rq-form label{display:block;font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;margin-bottom:5px}
.rq-form input{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:9px;font-size:13.5px;outline:none}
.rq-form input:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(201,150,44,.16)}
.rq-submit{background:linear-gradient(135deg,var(--accent),#D9A93F);color:#fff;border:none;border-radius:9px;padding:11px 18px;font-size:13.5px;font-weight:700;cursor:pointer}
.rq-submit:hover{filter:brightness(1.05)}
.rq-sec-title{font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:.8px;color:var(--navy);margin:22px 0 10px;padding-top:16px;border-top:1px solid var(--line)}
.rq-item{border:1px solid var(--line);border-radius:11px;padding:12px 14px;margin-bottom:10px}
.rq-item .top{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:5px}
.rq-item .nm{font-weight:700;color:var(--navy);font-size:14px}
.rq-item .meta{font-size:12px;color:var(--muted);line-height:1.55}
.rq-item .rate{font-weight:800;color:var(--navy)}
.st{display:inline-block;padding:3px 11px;border-radius:20px;font-size:11px;font-weight:800;white-space:nowrap}
.st-pending{background:#fff2df;color:#b45309}
.st-approved{background:#e2f7ee;color:#0b7a52}
.st-rejected{background:#fdecec;color:#e02424}
.rq-empty{color:var(--muted);font-size:13px;padding:10px 2px}
.rq-form .msdd{margin-bottom:0}
.rq-form .msdd>button{padding:11px 30px 11px 12px;font-size:13.5px}
.msdd .ss-opt{display:block;padding:9px 11px;border-radius:7px;font-size:13px;cursor:pointer;color:var(--ink)}
.msdd .ss-opt:hover{background:#F0F5F0}
.msdd .ss-opt.sel{background:#E7EFE7;color:var(--navy);font-weight:700}
.msdd .ss-empty{padding:9px 11px;font-size:12px;color:var(--muted)}
.toast{position:fixed;bottom:26px;right:26px;background:var(--navy);color:#fff;padding:13px 20px;border-radius:10px;font-size:13px;box-shadow:0 8px 24px rgba(0,0,0,.3);z-index:200}
@media(max-width:640px){.rq-form{grid-template-columns:1fr}}
/* DynLOB dynamic grid */
.dl-shell{max-width:1400px;margin:0 auto;padding:22px 26px 60px;display:grid;grid-template-columns:290px minmax(0,1fr);gap:20px;align-items:start}
.dl-shell>.dl-main{min-width:0}
.dl-bar{display:none}
.dl-filters{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);padding:18px 16px;position:sticky;top:82px;z-index:60}
.dl-fp{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.dl-fp b{font-size:12px;text-transform:uppercase;letter-spacing:1px;color:var(--navy)}
.dl-clearall2{background:none;border:none;color:var(--accent);font-weight:800;font-size:11px;cursor:pointer}
.dl-dd{position:relative;width:100%;margin-bottom:9px}
.dl-dd>button{width:100%;padding:11px 30px 11px 12px;border:1px solid var(--line);border-radius:9px;font-size:13px;background:#fff;cursor:pointer;text-align:left;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--ink)}
.dl-dd>button::after{content:'\25BE';position:absolute;right:11px;top:50%;transform:translateY(-50%);color:var(--muted);font-size:11px}
.dl-dd.open>button{border-color:var(--accent);box-shadow:0 0 0 3px rgba(201,150,44,.15)}
.dl-pnl{display:none;position:absolute;top:110%;left:0;right:auto;z-index:80;min-width:100%;width:max-content;max-width:min(360px,86vw);background:#fff;border:1px solid var(--line);border-radius:10px;box-shadow:0 12px 32px rgba(31,45,34,.2);max-height:320px;overflow:auto;padding:7px}
.dl-dd.open .dl-pnl{display:block}
.dl-pnl label{display:flex;gap:9px;align-items:flex-start;padding:7px 9px;border-radius:7px;font-size:12.5px;cursor:pointer;white-space:nowrap}
.dl-pnl label:hover{background:#F0F5F0}.dl-pnl input{accent-color:var(--navy);margin-top:1px}
.dl-cl{font-size:11px;color:var(--accent);cursor:pointer;padding:6px 9px;font-weight:800}
.dl-mss{width:calc(100% - 14px);margin:2px 7px 6px;padding:7px 9px;border:1px solid var(--line);border-radius:7px;font-size:12.5px;outline:none}
.dl-tools{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
.dl-search{flex:1;min-width:200px;position:relative}
.dl-search input{width:100%;padding:10px 12px 10px 34px;border:1px solid var(--line);border-radius:9px;font-size:13.5px;outline:none}
.dl-search span{position:absolute;left:11px;top:50%;transform:translateY(-50%);color:var(--muted)}
.dl-count{font-size:12.5px;color:var(--muted);font-weight:600;background:#fff;border:1px solid var(--line);border-radius:20px;padding:5px 12px}
.dl-chips{display:flex;flex-wrap:wrap;gap:7px;margin-bottom:12px}.dl-chips:empty{display:none}
.dl-chip{display:inline-flex;align-items:center;gap:7px;background:#E7EFE7;color:var(--navy);border-radius:20px;padding:4px 6px 4px 12px;font-size:12px;font-weight:600}
.dl-chip b{cursor:pointer;background:#fff;border-radius:50%;width:17px;height:17px;display:inline-flex;align-items:center;justify-content:center;font-size:11px;color:var(--muted)}
.dl-chip.dl-clearall{background:none;color:var(--accent);font-weight:800;cursor:pointer}
.dl-wrap{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden}
.dl-scroll{overflow:auto;max-height:72vh}
.dl-tbl{width:100%;border-collapse:collapse;font-size:13px}
.dl-tbl thead th{position:sticky;top:0;background:var(--navy);color:#fff;text-align:left;padding:11px 13px;font-size:11px;text-transform:uppercase;letter-spacing:.6px;font-weight:600;white-space:nowrap;cursor:pointer;z-index:5}
.dl-tbl tbody td{padding:10px 13px;border-bottom:1px solid var(--line);vertical-align:top}
.dl-tbl tbody tr:nth-child(even){background:#F7FAF7}.dl-tbl tbody tr:hover{background:#F5F1E3}
.dl-rate{font-weight:800;color:var(--navy)}
.dl-empty{padding:50px;text-align:center;color:var(--muted)}
@media(max-width:880px){
  .dl-shell{grid-template-columns:1fr;padding:14px 12px}
  .dl-bar{display:block;margin-bottom:2px}
  .dl-ftoggle{width:100%;padding:12px 14px;border:1px solid var(--line);border-radius:11px;background:#fff;color:var(--navy);font-weight:700;font-size:14px;cursor:pointer;box-shadow:var(--shadow)}
  .dl-filters{display:none;position:static}
  .dl-shell.dl-open .dl-filters{display:block}
}
@media(max-width:640px){
  .dl-tbl thead{display:none}.dl-tbl,.dl-tbl tbody{display:block}
  .dl-tbl tbody tr{display:block;margin:0 8px 10px;border:1px solid var(--line);border-radius:12px;overflow:hidden;background:#fff}
  .dl-tbl tbody td{display:flex;justify-content:space-between;gap:12px;text-align:right;border-bottom:1px solid #EEF3EE}
  .dl-tbl tbody td::before{content:attr(data-label);font-size:10.5px;text-transform:uppercase;letter-spacing:.4px;color:var(--muted);font-weight:800;text-align:left}
  .dl-tbl tbody td.dl-k0{background:linear-gradient(120deg,var(--navy),var(--navy2));color:#fff;text-align:left}
  .dl-tbl tbody td.dl-k0::before{display:none}
}

.lobsel{background:rgba(255,255,255,.15);border:1px solid rgba(255,255,255,.32);color:#fff;font-size:12.5px;font-weight:600;padding:8px 12px;border-radius:9px;cursor:pointer;outline:none}
.lobsel option{color:#1F2D22}
.dl-per{padding:1px 0;white-space:nowrap}.dl-per b{color:var(--accent);font-weight:800}.dl-per span{color:var(--muted);font-size:11px;margin-left:5px}.dl-rate-multi{line-height:1.35}

<script>
/* ===== DynLOB: shared dynamic-grid engine for uploaded LOB templates (Motor, Life, …) ===== */
window.DynLOB=(function(){
  const S={host:null,cols:[],rows:[],view:[],rateCol:-1,cfg:[],sel:{},q:'',sortKey:-1,sortAsc:true};
  const esc=s=>String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  /* ---- parse + classify (admin upload) ---- */
  function parse(wb){
    const sheet=wb.SheetNames[0];
    const aoa=XLSX.utils.sheet_to_json(wb.Sheets[sheet],{header:1,defval:'',raw:false});
    let hr=-1;
    for(let i=0;i<Math.min(aoa.length,15);i++){const cells=aoa[i].map(c=>String(c==null?'':c).trim()).filter(Boolean);if(cells.length<2)continue;const num=cells.filter(c=>/^-?\d+(\.\d+)?%?$/.test(c)).length;if(num/cells.length<0.4){hr=i;break;}}
    if(hr<0){hr=aoa.findIndex(r=>r.some(c=>String(c).trim()!==''));if(hr<0)hr=0;}
    let header=aoa[hr].map(c=>String(c).trim());let last=header.length-1;while(last>0&&!header[last])last--;header=header.slice(0,last+1);
    const rows=[];for(let i=hr+1;i<aoa.length;i++){const r=aoa[i];if(!String(r[0]||'').trim())continue;rows.push(header.map((_,c)=>String(r[c]==null?'':r[c]).trim()));}
    return {columns:header,rows};
  }
  function classify(cols,rows){
    const n=cols.length,dist=Array.from({length:n},()=>new Set()),fill=new Array(n).fill(0);
    rows.forEach(r=>{for(let i=0;i<n;i++){const v=r[i];if(v!==''&&v!=null){fill[i]++;if(dist[i].size<400)dist[i].add(v);}}});
    let rateCol=-1,bs=0;
    for(let i=0;i<n;i++){let num=0,tot=0;rows.forEach(r=>{const v=r[i];if(v!==''&&v!=null){tot++;if(/^\s*\d+(?:\.\d+)?\s*%?\s*$/.test(v))num++;}});if(tot<3)continue;const ratio=num/tot;if(ratio<0.6)continue;const kw=/commission|payout|\brate\b|\bpo\b/i.test(cols[i])?0.3:0;if(ratio+kw>bs){bs=ratio+kw;rateCol=i;}}
    const cfg=cols.map((h,i)=>{const d=dist[i].size;const meta=/note|caps|condition|effective|date|remark/i.test(h);const hideDef=/parameter/i.test(h);const single=fill[i]>0&&d<=1;const avg=[...dist[i]].reduce((a,v)=>a+String(v).length,0)/(d||1);const desc=avg>28;return{show:fill[i]>0&&!hideDef&&!single,filter:i!==rateCol&&!meta&&!hideDef&&!desc&&d>=2&&d<=300};});
    return {rateCol,cfg};
  }
  function build(name,wb){const {columns,rows}=parse(wb);const {rateCol,cfg}=classify(columns,rows);return{name,columns,rows,rateCol,cfg};}
  /* ---- render ---- */
  const q=sel=>S.host.querySelector(sel);
  function availRows(except){return S.rows.filter(r=>{for(const k in S.sel){if(String(k)===String(except))continue;if(S.sel[k].size&&!S.sel[k].has(r[k]))return false;}return true;});}
  /* filter option order: ranges like "<50k", ">50k - <1L", "Up to 10 years", "<1000" sort by value, text first */
  const _U={k:1e3,l:1e5,lakh:1e5,lac:1e5,cr:1e7};
  function optKey(v){const m=String(v).trim().match(/^(<=?|>=?|up\s*to|upto|below|less than|above|more than|over)?\s*₹?\s*(\d+(?:\.\d+)?)\s*(k|l|lakh|lac|cr)?(?![a-z])/i);if(!m)return null;let n=parseFloat(m[2])*(_U[(m[3]||'').toLowerCase()]||1);const op=(m[1]||'').toLowerCase();if(/^(<|up|below|less)/.test(op))n-=0.001;else if(/^(>|above|more|over)/.test(op))n+=0.001;return n;}
  function optCmp(a,b){const x=optKey(a),y=optKey(b);if(x==null&&y==null)return String(a).localeCompare(String(b));if(x==null)return -1;if(y==null)return 1;return x-y||String(a).localeCompare(String(b));}
  function computeAvail(){const fi=S.cols.map((h,i)=>i).filter(i=>S.cfg[i]&&S.cfg[i].filter);const act=fi.filter(i=>S.sel[i]&&S.sel[i].size);const sets={};fi.forEach(i=>sets[i]=new Set());for(const r of S.rows){let n=0,fail=-1;for(const i of act){if(!S.sel[i].has(r[i])){n++;fail=i;if(n>1)break;}}if(n>1)continue;if(n===0){for(const i of fi){const v=r[i];if(v!==''&&v!=null)sets[i].add(v);}}else{const v=r[fail];if(v!==''&&v!=null)sets[fail].add(v);}}S.avail={};fi.forEach(i=>{S.avail[i]=[...sets[i]].sort(optCmp);});}
  function distinctOf(i){if(!S.avail)computeAvail();return S.avail[i]||[];}
  function refreshOptions(){S.cols.forEach((h,i)=>{if(!S.cfg[i]||!S.cfg[i].filter)return;const dd=q(`.dl-dd[data-i="${i}"]`);if(!dd||dd.classList.contains('open'))return;const vals=distinctOf(i);const sb=vals.length>12?`<input class="dl-mss" placeholder="Type to filter…" oninput="DynLOB.msearch(${i},this.value)">`:'';dd.querySelector('.dl-pnl').innerHTML=`<div class="dl-cl" onclick="DynLOB.clear(${i})">✕ Clear</div>${sb}`+vals.map(v=>`<label data-t="${esc(String(v).toLowerCase())}"><input type="checkbox" onchange="DynLOB.pick(${i},this)" data-v="${esc(v)}" ${S.sel[i].has(v)?'checked':''}>${esc(v)}</label>`).join('');});}
  function mount(host){S.host=host;host.innerHTML=`
    <div class="dl-bar"><button class="dl-ftoggle" onclick="DynLOB.toggle()">⚙ Filters</button></div>

  function pick(i,el){if(el.checked)S.sel[i].add(el.dataset.v);else S.sel[i].delete(el.dataset.v);label(i);apply();refreshOptions();}

  function msearch(i,val){val=String(val).toLowerCase();q(`.dl-dd[data-i="${i}"]`).querySelectorAll('label').forEach(l=>l.style.display=l.dataset.t.includes(val)?'':'none');}

  let _st=null;function search(v){clearTimeout(_st);_st=setTimeout(()=>{S.q=String(v).toLowerCase();apply();},200);}
  const fmt=v=>{const m=String(v).match(/^\s*(\d+(?:\.\d+)?)\s*%?\s*$/);return m?(+m[1])+'%':v;};
  const MON3=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  function effISO(lab){lab=String(lab||'').trim();let m=lab.match(/^from:(\d{4}-\d{2}-\d{2})$/);if(m)return m[1];m=lab.match(/^(\d{1,2})(?:\s+([A-Za-z]{3})[a-z]*)?(?:\s+(\d{4}))?\s*[–-]\s*\d{1,2}\s+([A-Za-z]{3})[a-z]*\s+(\d{4})/);if(m){const mi=MON3.findIndex(x=>x.toLowerCase()===String(m[2]||m[4]).toLowerCase());if(mi>=0)return (m[3]||m[5])+'-'+String(mi+1).padStart(2,'0')+'-'+String(m[1]).padStart(2,'0');}m=lab.match(/^(\d{4}-\d{2}-\d{2})$/);return m?m[1]:'';}

  /* dated rates ("58% @@ from:2026-10-01 ~~ 60% @@ from:2026-09-01") -> one row per period + an "Effective From" column (newest first) */
  function expand(){S.src=null;const rc=S.rateCol;if(rc<0||!S.rows.some(r=>String(r[rc]).indexOf('@@')>=0))return;const src=S.rows;S.src=src;S.cols=S.cols.slice(0,rc+1).concat(['Effective From'],S.cols.slice(rc+1));S.cfg=S.cfg.slice(0,rc+1).concat([{show:true,filter:true}],S.cfg.slice(rc+1));const out=[];src.forEach((r,ix)=>{const ss=String(r[rc]).indexOf('@@')>=0?segs(r[rc]):[{rate:r[rc],lab:'',iso:''}];ss.forEach((s,k)=>{const nr=r.slice(0,rc).concat([s.rate,effTxt(s.iso)||s.lab],r.slice(rc+1));nr._i=ix;nr._old=k>0;out.push(nr);});});S.rows=out;}
  function hl(v){const s=String(v==null?'':v);const terms=S.q.split(/\s+/).filter(Boolean);if(!terms.length)return esc(s);if(!S._hre||S._hq!==S.q){S._hq=S.q;S._hre=new RegExp('('+terms.sort((a,b)=>b.length-a.length).map(t=>t.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')).join('|')+')','gi');}return s.split(S._hre).map((p,i)=>i%2?'<mark class="dl-hl">'+esc(p)+'</mark>':esc(p)).join('');}
  function perHTML(v){return String(v).split(/\s*~~\s*/).filter(Boolean).map(function(p){var kv=p.split(/\s*@@\s*/);var r=kv[0]||'',lab=kv[1]||'';return '<div class="dl-per"><b>'+hl(fmt(r))+'</b>'+(lab?' <span>'+hl(lab)+'</span>':'')+'</div>';}).join('');}
  function apply(){S.avail=null;S.limit=0;const terms=S.q.split(/\s+/).filter(Boolean);S.view=S.rows.filter(r=>{for(const i in S.sel){if(S.sel[i].size&&!S.sel[i].has(r[i]))return false;}if(!terms.length)return true;const hay=r._h||r.join(' ').toLowerCase();return terms.every(t=>hay.includes(t));});if(S.sortKey>=0){S.view.sort((a,b)=>{const x=a[S.sortKey],y=b[S.sortKey],nx=parseFloat(x),ny=parseFloat(y);let c=(!isNaN(nx)&&!isNaN(ny))?nx-ny:String(x).localeCompare(String(y));return S.sortAsc?c:-c;});}render();}

  const CAP=300;
  function hasVal(v){if(v===''||v==null)return false;return String(v).trim().toLowerCase()!=='all';}

  function render(){const vc=S.cols.map((h,i)=>i).filter(i=>S.cfg[i]&&S.cfg[i].show&&(i===S.rateCol||S.view.some(r=>hasVal(r[i]))));q('.dl-thr').innerHTML=vc.map(i=>`<th onclick="DynLOB.sort(${i})">${esc(S.cols[i])}</th>`).join('');const lim=S.showAll?Infinity:(S.limit||CAP);const capped=S.view.length>lim;const shown=capped?S.view.slice(0,lim):S.view;const nf=n=>Number(n).toLocaleString('en-IN');q('.dl-count').innerHTML=capped?`Showing ${nf(lim)} of ${nf(S.view.length)} · <button type="button" class="dl-more" onclick="DynLOB.more()">Show more</button> · <button type="button" class="dl-more" onclick="DynLOB.showAll()">Show all</button>`:nf(S.view.length)+' of '+nf(S.rows.length)+' rows';q('.dl-empty').style.display=S.view.length?'none':'';q('.dl-tbl').style.display=S.view.length?'':'none';q('.dl-tb').innerHTML=shown.map(r=>'<tr'+(r._old?' class="dl-old"':'')+'>'+vc.map((i,k)=>{let val=r[i];if(val===''||val==null)val='—';let cls=k===0?'dl-k0':'';if(i===S.rateCol&&val!=='—'&&String(val).indexOf('@@')>=0){return `<td class="dl-rate dl-rate-multi" data-label="${esc(S.cols[i])}">${perHTML(val)}</td>`;}if(i===S.rateCol&&val!=='—'){val=fmt(val);cls='dl-rate';}return `<td class="${cls}" data-label="${esc(S.cols[i])}">${val==='—'?val:hl(val)}</td>`;}).join('')+'</tr>').join('');chips();filterVis();}
  function chips(){const host=q('.dl-chips');const items=[];Object.keys(S.sel).forEach(i=>{[...S.sel[i]].forEach(v=>{items.push(`<span class="dl-chip" data-i="${i}" data-v="${esc(v)}">${esc(S.cols[i])}: ${esc(v)} <b>✕</b></span>`);});});host.innerHTML=items.length?items.join('')+'<span class="dl-chip dl-clearall">Clear all</span>':'';}
  function toggle(){S.host.classList.toggle('dl-open');}
  document.addEventListener('click',e=>{const c=e.target.closest('.dl-chip');if(!c||!S.host||!S.host.contains(c))return;if(c.classList.contains('dl-clearall')){reset();return;}const i=c.dataset.i,v=c.dataset.v;if(S.sel[i]){S.sel[i].delete(v);buildFilters();apply();}});
  document.addEventListener('click',e=>{if(S.host&&!e.target.closest('.dl-dd'))S.host.querySelectorAll('.dl-dd.open').forEach(d=>d.classList.remove('open'));});
  return {mount,load,build,open,pick,clear:clr,msearch,reset,search,sort:sortBy,toggle,state:S,showAll:function(){S.showAll=true;render();},more:function(){S.limit=(S.limit||CAP)+700;render();}};

<script>
/* ================= Firebase (read-only shared grid) ================= */
const DEFAULT_FB_CFG = {
  apiKey: "AIzaSyD7ND6xkJmUWnpq7RrVfyQKEDzVhchMc6k",
  authDomain: "grid-matrix.firebaseapp.com",
  projectId: "grid-matrix",
  storageBucket: "grid-matrix.firebasestorage.app",
  messagingSenderId: "663754323566",
  appId: "1:663754323566:web:db889ecdc6103995dfd87f"
};
function loadScript(src){ return new Promise((res, rej) => { const s = document.createElement('script'); s.src = src; s.onload = res; s.onerror = () => rej(new Error('load ' + src)); document.head.appendChild(s); }); }
function setLive(text, cls){ const e = document.getElementById('live'); e.className = 'live ' + (cls||''); document.getElementById('liveText').textContent = text; }

let db = null, reqs = [], reqSel = {}, masters = { insurers: [], products: [] }, lobs = {};
/* gzip-compressed grid storage (rowsZ = base64 gzip of rowsJson) — lets big grids fit Firestore's 1 MB doc limit */
async function zUnpack(d){
  if (!d || !d.rowsZ) return;
  try{
    const bin = atob(d.rowsZ), u8 = new Uint8Array(bin.length);
    for (let i = 0; i < bin.length; i++) u8[i] = bin.charCodeAt(i);
    d.rowsJson = await new Response(new Blob([u8]).stream().pipeThrough(new DecompressionStream('gzip'))).text();
  }catch(e){ d.rowsJson = '[]'; }
}
try{ const _m = JSON.parse(localStorage.getItem('gmp_masters')); if (_m){ masters.insurers = _m.insurers||[]; masters.products = _m.products||[]; } }catch(e){}
async function boot(){
  try{ DynLOB.mount(document.getElementById("dynHost")); }catch(e){}
  // 1) instant paint from any locally cached grid (same device)
  try{
    const g = JSON.parse(localStorage.getItem('gmp_grid'));
    if (g && Array.isArray(g.rows) && g.rows.length){ ingest(g.rows); }
  }catch(e){}

  // 2) live read from Firestore
  try{
    let cfg = null;
    try{ cfg = JSON.parse(localStorage.getItem('gmp_fbcfg')); }catch(e){}
    cfg = cfg || DEFAULT_FB_CFG;
    await loadScript('https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js');
    await loadScript('https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js');
    if (!firebase.apps.length) firebase.initializeApp(cfg);
    db = firebase.firestore();
    db.collection('gmp_requests').orderBy('ts','desc').limit(150).onSnapshot(s => {
      reqs = s.docs.map(d => ({ id: d.id, ...d.data() }));
      renderReqList();
    }, () => {});
    db.collection('gmp_lobs').onSnapshot(async s => {
      const nl = {}; s.forEach(d => nl[d.id] = { id:d.id, ...d.data() });
      await Promise.all(Object.values(nl).map(zUnpack));      // large grids are stored gzip-compressed
      lobs = nl; populateLobs();
    }, () => {});
    db.collection('gmp_meta').doc('masters').onSnapshot(doc => {
      const d = doc.data() || {};
      masters.insurers = Array.isArray(d.insurers) ? d.insurers : [];
      masters.products = Array.isArray(d.products) ? d.products : [];
      try{ localStorage.setItem('gmp_masters', JSON.stringify(masters)); }catch(e){}
      if (rows.length) buildGrid();
    }, () => {});
    db.collection('gmp').doc('grid').onSnapshot(doc => {
      const d = doc.data();
      if (!d || !d.rowsJson){ if (!rows.length) noData(); return; }
      try{
        const parsed = JSON.parse(d.rowsJson);
        ingest(parsed);
        try{ localStorage.setItem('gmp_grid', JSON.stringify({file: d.file||'', ts: d.ts||Date.now(), rows: parsed})); }catch(e){}
        setLive('Live · updated ' + (d.ts ? new Date(d.ts).toLocaleDateString() : 'now'), 'ok');
      }catch(e){ if (!rows.length) noData(); }
    }, err => { if (!rows.length) noData('Could not reach the live database.'); else setLive('Offline copy', 'err'); });
  }catch(e){
    if (!rows.length) noData('Could not connect to the live database.');
    else setLive('Offline copy', 'err');
  }
}
function noData(msg){
  document.getElementById('loadState').innerHTML =
    '<div class="ic">📭</div>' + (msg || 'No grid has been published yet.') +
    '<div style="font-size:12px;margin-top:8px;color:#9aa79c">Once an admin publishes a grid it will appear here automatically.</div>';
  setLive('No data', 'err');
}

/* ================= GRID ================= */
const COLS = ['Insurer','Product / Plan','Business Type','Location Type','Sub-Condition','Commission Rate (IDEAL)','SI Slab: < 10 Lac','SI Slab: ≥ 10 Lac','Conditions, Caps & Notes','Effective Date'];
const SHOW = [0,1,2,4,5,6,7];   // hides Location Type, Conditions/Notes & Effective Date columns
let rows = [], view = [], sortKey = -1, sortAsc = true;
const $ = id => document.getElementById(id);

function esc(s){ return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;'); }
function hasVal(v){ const s = String(v==null?'':v).trim(); return s !== '' && s !== '—'; }
function blankCls(v){ return hasVal(v) ? '' : ' blank'; }
function pct(s){ const m = String(s).match(/(\d+(?:\.\d+)?)\s*%/); return m ? parseFloat(m[1]) : null; }
function fmtRate(v){ const p = v <= 1.5 ? v * 100 : v; return (+p.toFixed(2)) + '%'; }
function normRate(v){
  if (typeof v === 'number' && isFinite(v)) return v === 0 ? '0%' : fmtRate(v);
  const s = String(v == null ? '' : v).trim();
  if (/^\d*\.?\d+$/.test(s)) return fmtRate(parseFloat(s));
  return s;
}
const MON3 = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
function cleanLoc(s){
  let t = String(s||'').replace(/\(?\s*hover[^)]*\)?/ig, '').trim();
  if (/specific\s*cities/i.test(t)) return 'Specific Cities';
  return t.replace(/^0%\s*[—–-]*\s*/,'').replace(/\s*[\/—–-]+\s*$/,'').trim() || 'All';
}

/* normalize rows loaded from cloud so old snapshots render cleanly */
function ingest(data){
  rows = (data||[]).map(r => {
    r = r.slice();
    r[3] = cleanLoc(r[3]);
    for (let j = 5; j <= 7; j++) r[j] = normRate(r[j]);
    return r;
  });
  document.getElementById('loadState').classList.add('hidden');
  buildGrid();
}

/* ---------- Multiselect dropdowns ---------- */
const MS_LABEL = {fPlan:'All Business Plan', fIns:'All Insurer', fBiz:'All Business Types', fLoc:'All Locations'};
const msSel = {fPlan:new Set(), fIns:new Set(), fBiz:new Set(), fLoc:new Set()};
function cityList(r){
  let t = String(r[10]||'');
  if (!t) return [];
  const ci = t.lastIndexOf(':');
  if (ci > -1) t = t.slice(ci + 1);
  return t.split(/[\/\n,]+/).map(x => x.trim()).filter(x => x && x.length < 45);
}
function buildMs(id, values){
  const sel = msSel[id];
  [...sel].forEach(v => { if (!values.includes(v)) sel.delete(v); });
  const host = $(id);
  host._vals = values;
  host.innerHTML = `<button type="button" onclick="msOpen('${id}')"></button>
    <div class="pnl"><div class="clr" onclick="msClear('${id}')">✕ Clear selection</div>` +
    values.map((v, i) => `<label><input type="checkbox" data-dd="${id}" data-i="${i}" ${sel.has(v) ? 'checked' : ''}>${esc(v)}</label>`).join('') + `</div>`;
  msLabel(id);
}
function buildMsGrouped(id, groups){
  const sel = msSel[id];
  const flat = [];
  groups.forEach(g => g.items.forEach(v => flat.push(v)));
  [...sel].forEach(v => { if (!flat.includes(v)) sel.delete(v); });
  const host = $(id);
  host._vals = flat;
  let i = 0;
  host.innerHTML = `<button type="button" onclick="msOpen('${id}')"></button>
    <div class="pnl"><div class="clr" onclick="msClear('${id}')">✕ Clear selection</div>` +
    groups.map(g => `<div class="grp">${esc(g.label)}</div>` +
      g.items.map(v => `<label><input type="checkbox" data-dd="${id}" data-i="${i++}" ${sel.has(v) ? 'checked' : ''}>${esc(v)}</label>`).join('')
    ).join('') + `</div>`;
  msLabel(id);
}
function msLabel(id){
  const n = msSel[id].size;
  $(id).querySelector('button').textContent = n ? MS_LABEL[id].replace(/^All /,'') + ' · ' + n + ' selected' : MS_LABEL[id];
}
function msOpen(id){
  document.querySelectorAll('.msdd.open').forEach(d => { if (d.id !== id) d.classList.remove('open'); });
  $(id).classList.toggle('open');
}
function msClear(id){
  msSel[id].clear();
  $(id).querySelectorAll('input').forEach(i => i.checked = false);
  msLabel(id);
  applyFilters();
}
function clearAll(){
  Object.keys(msSel).forEach(id => msSel[id].clear());
  buildGrid();
}
document.addEventListener('change', e => {
  const dd = e.target.dataset ? e.target.dataset.dd : null;
  if (!dd) return;
  const v = $(dd)._vals[+e.target.dataset.i];
  if (e.target.checked) msSel[dd].add(v); else msSel[dd].delete(v);
  msLabel(dd);
  applyFilters();
});
document.addEventListener('click', e => {
  if (!e.target.closest('.msdd')) document.querySelectorAll('.msdd.open').forEach(d => d.classList.remove('open'));
});

/* ---------- Build filters + header ---------- */
function buildGrid(){
  buildMs('fPlan', [...new Set([...rows.map(r => r[1]), ...masters.products].filter(Boolean))].sort());
  buildMs('fIns',  [...new Set([...rows.map(r => r[0]), ...masters.insurers].filter(Boolean))].sort());
  buildMs('fBiz',  [...new Set(rows.map(r => r[2]).filter(Boolean))].sort());
  const cities = new Set();
  rows.forEach(r => cityList(r).forEach(c => cities.add(c)));
  buildMs('fLoc', [...cities].sort((a,b) => a.localeCompare(b)));
  $('thr').innerHTML = SHOW.map(i => `<th onclick="sortBy(${i})">${COLS[i]}<span class="arrow" id="ar${i}"></span></th>`).join('');
  applyFilters();
}

/* ---------- Filter / sort / render ---------- */
function anyFilterActive(){ return Object.values(msSel).some(s => s.size); }
function applyFilters(){
  view = !anyFilterActive() ? [] : rows.filter(r => {
    if (msSel.fPlan.size && !msSel.fPlan.has(r[1])) return false;
    if (msSel.fIns.size && !msSel.fIns.has(r[0])) return false;
    if (msSel.fBiz.size && !msSel.fBiz.has(r[2])) return false;
    if (msSel.fLoc.size){
      const cov = String(r[10]||'').toLowerCase();
      const hit = [...msSel.fLoc].some(c => cov.includes(c.toLowerCase()) || r[3] === c);
      if (!hit && r[3] !== 'All') return false;
    }
    return true;
  });
  if (sortKey >= 0){
    view.sort((a,b) => {
      const pa = pct(a[sortKey]), pb = pct(b[sortKey]);
      let c = (pa !== null && pb !== null) ? pa - pb : String(a[sortKey]).localeCompare(String(b[sortKey]));
      return sortAsc ? c : -c;
    });
  }

}
function sortBy(i){
  sortAsc = (sortKey === i) ? !sortAsc : true; sortKey = i;
  SHOW.forEach(j => { const a = $('ar'+j); if (a) a.textContent = j===i ? (sortAsc?'▲':'▼') : ''; });
  applyFilters();
}
function badge(t){
  const s = String(t||'').toLowerCase();
  let cls = 'b-other';
  if (s.includes('new') || s.includes('fresh')) cls = 'b-new';
  if (s.includes('renew')) cls = 'b-renew';
  if (s.includes('port')) cls = 'b-port';
  if (s.includes('roll')) cls = 'b-roll';
  return `<span class="badge ${cls}">${esc(t)||'—'}</span>`;
}
function rateCell(v){
  const p = pct(v);
  let cls = 'rate';
  if (p !== null && p >= 30) cls += ' rate-hi';
  if (p === 0 || /^0%/.test(v)) cls += ' rate-zero';
  return `<span class="${cls}">${esc(v)||'—'}</span>`;
}
function render(){
  const active = anyFilterActive();
  $('filterPrompt').classList.toggle('hidden', active);
  updateFilterCount();
  if (!active){
    $('count').textContent = 'Select a filter';
    $('tbl').classList.add('hidden');
    $('emptyState').classList.add('hidden');
    $('tbody').innerHTML = '';
    return;
  }
  $('count').textContent = view.length + ' of ' + rows.length + ' rules';
  $('emptyState').classList.toggle('hidden', view.length > 0);
  $('tbl').classList.toggle('hidden', view.length === 0);
  $('tbody').innerHTML = view.map((r, i) => `<tr onclick="openModal(${i})">
    <td class="insurer" data-label="Insurer">${esc(r[0])}</td>
    <td data-label="Product / Plan" class="${blankCls(r[1])}">${esc(r[1])||'—'}</td>
    <td data-label="Business Type" class="${blankCls(r[2])}">${badge(r[2])}</td>
    <td class="notes${(hasVal(r[4])||r[10]) ? '' : ' blank'}" data-label="Sub-Condition">${esc(r[4])||'—'}${r[10] ? `<span class="locinfo" data-tip="${esc(r[10])}">i</span>` : ''}</td>
    <td data-label="Commission (IDEAL)" class="${blankCls(r[5])}">${rateCell(r[5])}</td>
    <td data-label="SI < 10 Lac" class="${blankCls(r[6])}">${esc(r[6])||'—'}</td>
    <td data-label="SI ≥ 10 Lac" class="${blankCls(r[7])}">${esc(r[7])||'—'}</td>
  </tr>`).join('');
}
function updateFilterCount(){
  let n = 0;
  Object.keys(msSel).forEach(id => n += msSel[id].size);
  const fc = $('fcount'); if (fc) fc.textContent = n ? n : '';
}
function toggleFilters(){ document.body.classList.toggle('filters-open'); }

/* ---------- Modal ---------- */
function openModal(i){
  const r = view[i];
  $('modalHost').innerHTML = `<div class="overlay" onclick="if(event.target===this)closeModal()">
    <div class="modal">
      <div class="mh"><div><h3>${esc(r[0])}</h3><p>${esc(r[1])}</p></div>
      <button class="close" onclick="closeModal()">✕</button></div>
      <div class="mb">${COLS.map((c,j) => hasVal(r[j]) ? `<div class="frow"><div class="k">${c}</div><div class="v">${esc(r[j])}</div></div>` : '').join('')}
      ${r[10] ? `<div class="frow"><div class="k">Covered Locations</div><div class="v" style="font-size:12.5px;color:var(--muted)">${esc(r[10])}</div></div>` : ''}</div>
    </div></div>`;
}
function closeModal(){ $('modalHost').innerHTML = ''; }
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeModal(); });

/* ---------- Suggest a rate → approval workflow ---------- */
function uni(i){ const extra = i===0 ? masters.insurers : i===1 ? masters.products : []; return [...new Set([...rows.map(r => r[i]), ...extra].filter(Boolean))].sort((a,b) => String(a).localeCompare(String(b))); }
function toast(m){ const t = document.createElement('div'); t.className = 'toast'; t.textContent = m; document.body.appendChild(t); setTimeout(() => t.remove(), 3200); }
function stCls(s){ return s === 'Approved' ? 'st-approved' : s === 'Rejected' ? 'st-rejected' : 'st-pending'; }
function ssField(id, placeholder, opts, pre){
  reqSel[id] = pre || '';
  const list = opts.length
    ? opts.map(v => `<div class="ss-opt ${v===pre?'sel':''}" data-v="${esc(v)}" onclick="ssPick('${id}', this.dataset.v)">${esc(v)}</div>`).join('')
    : '<div class="ss-empty">No options yet</div>';
  return `<div class="msdd" id="${id}"><button type="button" onclick="msOpen('${id}')">${pre ? esc(pre) : placeholder}</button><div class="pnl">${list}</div></div>`;
}
function ssPick(id, val){
  reqSel[id] = val;
  const dd = $(id); if (!dd) return;
  dd.querySelector('button').textContent = val;
  dd.querySelectorAll('.ss-opt').forEach(o => o.classList.toggle('sel', o.dataset.v === val));
  dd.classList.remove('open');
}
function openReqModal(){
  const cities = new Set(); rows.forEach(r => cityList(r).forEach(c => cities.add(c)));
  const dl = (id, vals) => `<datalist id="${id}">${vals.map(v => `<option value="${esc(v)}"></option>`).join('')}</datalist>`;
  const pf = id => msSel[id] && msSel[id].size === 1 ? [...msSel[id]][0] : '';
  $('modalHost').innerHTML = `<div class="overlay" onclick="if(event.target===this)closeModal()">
    <div class="modal">
      <div class="mh"><div><h3>Suggest a missing rate</h3><p>Fill the details and send it to the admin for approval</p></div>
      <button class="close" onclick="closeModal()">✕</button></div>
      <div class="mb">
        <div class="rq-form">
          <div class="full"><label>Your name</label><input id="rqBy" value="${esc(localStorage.getItem('gmp_vname')||'')}" placeholder="Your name"></div>
          <div class="full"><label>Insurer</label>${ssField('ssIns','Select insurer', uni(0), pf('fIns'))}</div>
          <div class="full"><label>Product / Plan</label>${ssField('ssProd','Select product / plan', uni(1), pf('fPlan'))}</div>
          <div class="full"><label>Business Type</label>${ssField('ssBiz','Select business type', uni(2), pf('fBiz'))}</div>
          <div class="full"><label>Proposed commission rate</label><input id="rqRate" placeholder="e.g. 32%"></div>
          <div class="full" style="display:flex;justify-content:flex-end;margin-top:2px"><button class="rq-submit" onclick="submitReq()">Send for approval →</button></div>
        </div>
        <div class="rq-sec-title">Requests &amp; status</div>
        <div id="rqList"></div>
      </div>
    </div></div>`;
  renderReqList();
}
async function submitReq(){
  const g = id => ($(id) ? $(id).value.trim() : '');
  const by = g('rqBy'), rate = g('rqRate');
  const ins = (reqSel.ssIns||'').trim(), prod = (reqSel.ssProd||'').trim(), biz = (reqSel.ssBiz||'').trim();
  if (!ins || !prod) return toast('⚠ Select the insurer and product.');
  if (!rate) return toast('⚠ Enter the proposed rate.');
  if (!by) return toast('⚠ Enter your name.');
  if (!db) return toast('⚠ Can’t submit while offline — try again once connected.');
  try{ localStorage.setItem('gmp_vname', by); }catch(e){}
  const btn = document.querySelector('.rq-submit'); if (btn){ btn.disabled = true; btn.textContent = 'Sending…'; }
  try{
    await db.collection('gmp_requests').add({ insurer: ins, product: prod, business: biz, location: '', rate, by, status: 'Pending', ts: Date.now() });
    toast('✅ Sent to admin for approval');
    if ($('rqRate')) $('rqRate').value = '';
  }catch(e){ toast('❌ Could not submit: ' + (e.message||'error')); }
  if (btn){ btn.disabled = false; btn.textContent = 'Send for approval →'; }
}
function renderReqList(){
  const host = $('rqList'); if (!host) return;
  if (!reqs.length){ host.innerHTML = '<div class="rq-empty">No requests yet — be the first to suggest a rate.</div>'; return; }
  host.innerHTML = reqs.map(q => {
    const bits = [q.business, q.location].filter(Boolean).join(' · ');
    const rev = q.reviewedBy ? ` · ${esc(String(q.status).toLowerCase())} by ${esc(q.reviewedBy)}` : '';
    return `<div class="rq-item"><div class="top"><span class="nm">${esc(q.insurer)} — ${esc(q.product)}</span><span class="st ${stCls(q.status)}">${esc(q.status)}</span></div>
      <div class="meta">Proposed rate: <span class="rate">${esc(q.rate)}</span>${bits ? ' · ' + esc(bits) : ''}<br>By ${esc(q.by)}${rev}</div></div>`;
  }).join('');
}

function populateLobs(){
  const sel=$('lobSwitch'); if(!sel) return; const cur=sel.value;
  const names=Object.values(lobs).filter(l=>(l.columns&&l.columns.length)).sort((a,b)=>String(a.name||'').localeCompare(String(b.name||'')));
  sel.innerHTML='<option value="__health__">Health</option>'+names.map(l=>`<option value="${esc(l.id)}">${esc(l.name||l.id)}</option>`).join('');
  if([...sel.options].some(o=>o.value===cur)) sel.value=cur; else sel.value='__health__';
  if(sel.value!=='__health__' && lobs[sel.value]) loadDynLob(sel.value);
}
function switchLob(){
  const v=$('lobSwitch').value, health=(v==='__health__');
  $('healthShell').classList.toggle('hidden', !health);
  $('dynHost').classList.toggle('hidden', health);
  $('btnSuggest').classList.toggle('hidden', !health);
  if(!health) loadDynLob(v);
}
function loadDynLob(id){
  const l=lobs[id]; if(!l) return;
  let rows=[], cfg=[];
  try{ rows=JSON.parse(l.rowsJson||'[]'); }catch(e){}
  try{ cfg=JSON.parse(l.cfgJson||'[]'); }catch(e){}
  DynLOB.load({name:l.name, columns:l.columns||[], rows, rateCol:(l.rateCol==null?-1:l.rateCol), cfg});
}
boot();
</script>
<style>.dl-dd.dl-up .dl-pnl,.msdd.dl-up .pnl{top:auto!important;bottom:110%!important}</style>
<script>
(function(){
 function place(dd){
   var pnl=dd.querySelector('.dl-pnl,.pnl'); var btn=dd.querySelector('button');
   if(!pnl||!btn) return;
   var b=btn.getBoundingClientRect();
   var below=window.innerHeight-b.bottom-14, above=b.top-14;
   var flip=(below<Math.min(300,pnl.scrollHeight))&&(above>below);
   // only touch the DOM when something actually changes (no observer here, but stay cheap)
   if(flip!==dd.classList.contains('dl-up')) dd.classList.toggle('dl-up',flip);
   var mh=flip?Math.min(340,above):Math.min(340,Math.max(150,below));
   var mhpx=mh+'px';
   if(pnl.style.maxHeight!==mhpx) pnl.style.maxHeight=mhpx;
 }
 function run(){ document.querySelectorAll('.dl-dd.open,.msdd.open').forEach(place); }
 // after any click, let the grid engine toggle .open first, then position once
 document.addEventListener('click',function(){ requestAnimationFrame(run); },false);
 window.addEventListener('resize',run);
})();
</script>
